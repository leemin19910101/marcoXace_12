<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>檔案管理｜41</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"><script src="admin.js" defer></script></head><body><header class="masthead"><a class="brand" href="/"><img src="seal.svg" alt="" width="38"><span>41 / ARCHIVE MANAGER<small>檔案管理室</small></span></a><a href="/">返回網站 ↗</a></header>
<main class="admin-container"><div class="admin-heading"><div><p class="eyebrow">CONTENT MANAGEMENT / OWNER ACCESS</p><h1>你的作品，<br>在這裡歸檔。</h1><p>上傳圖片、編排漫畫，或寫下一個新的星期三。</p></div><span class="stamp">LEVEL 04</span></div>
<p id="notice" class="notice" role="status" hidden></p>
<section id="login"><form id="loginForm" class="login-form"><h2>登入管理室</h2><p>讀者可以直接閱讀。管理內容需要密碼。</p><label>管理密碼<input id="password" type="password" autocomplete="current-password" required></label><button class="button dark" type="submit">進入管理室 →</button></form></section>
<section id="dashboard" hidden><div class="management-bar"><div class="upload-types"><button data-new="插畫">＋ 上傳圖片</button><button data-new="漫畫">＋ 上傳漫畫</button><button data-new="小說">＋ 新增小說</button></div><div class="admin-actions"><button id="backup">下載備份</button><button id="changePassword">更改密碼</button><button id="logout">登出</button></div></div><div class="admin-filter"><label>搜尋作品<input id="adminSearch" placeholder="輸入作品標題"></label><label>分類<select id="adminType"><option value="">全部</option><option>插畫</option><option>漫畫</option><option>小說</option></select></label></div><div id="adminList"></div></section>
<section id="editor" hidden><form id="editForm"><div class="editor-heading"><h2 id="editorTitle"></h2><button type="button" id="cancelEdit">← 返回作品列表</button></div><div class="edit-grid"><div><label>作品標題 *<input id="title" required maxlength="150" placeholder="例如：哥哥的水比較好喝"></label><label>公文式標題<input id="officialTitle" maxlength="200" placeholder="例如：第一王子飲用水遭竊事件"></label><div class="field-row"><label>檔案編號<input id="number" maxlength="40" placeholder="041-036"></label><label>標籤（以逗號分隔）<input id="tagsInput" placeholder="日常，純糖"></label></div><label>簡介<textarea id="summary" rows="3" maxlength="1000" placeholder="讓讀者想打開的一句話。"></textarea></label><label id="bodyField">小說正文 *<textarea id="bodyInput" rows="18" placeholder="貼上或直接寫入小說。空一行會分成新的段落。"></textarea></label><div id="mediaField"><label class="upload-area">選擇圖片或拖曳到這裡<input id="mediaInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple><span>JPG / PNG / WebP / GIF · 最多 100 頁<br>大型靜態圖片會自動縮至 2200px，保留原始檔在你的電腦。</span></label><p id="uploadStatus" role="status"></p><div id="mediaList"></div></div><label>歸檔評語（選填）<textarea id="assessment" rows="3" placeholder="本事件未對卡金王國國家安全造成實質威脅。"></textarea></label></div><aside><h3>發布設定</h3><label class="check"><input id="published" type="checkbox">公開作品</label><p>未勾選時保存為草稿，讀者看不到。</p><label class="check"><input id="restricted" type="checkbox">閱讀前顯示內容提示</label><label id="mainComicField" class="check"><input id="mainComic" type="checkbox">設為首頁《追憶》主篇</label><label class="check"><input id="sample" type="checkbox">標示為示範短篇</label><p>漫畫頁面依下方順序閱讀，第一張作為目錄縮圖。</p><button id="preview" type="button" class="button">預覽作品 ↗</button><button id="save" type="submit" class="button dark">保存作品 →</button><p id="saveStatus" role="status"></p></aside></div></form></section></main>
<dialog id="previewDialog"><button id="closePreview" class="dialog-close" aria-label="關閉">×</button><div id="previewContent"></div></dialog><dialog id="deleteDialog"><h2>刪除這篇作品？</h2><p>刪除後讀者將無法閱讀。你可以先下載備份。</p><div class="admin-actions"><button id="cancelDelete">取消</button><button id="confirmDelete" class="danger">確認刪除</button></div></dialog><dialog id="passwordDialog"><button id="closePassword" class="dialog-close" aria-label="關閉">×</button><form id="passwordForm"><h2>更改管理密碼</h2><label>新密碼（至少 12 字元）<input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="200" required></label><button class="button dark">保存密碼</button><p id="passwordStatus" role="status"></p></form></dialog></body></html>
